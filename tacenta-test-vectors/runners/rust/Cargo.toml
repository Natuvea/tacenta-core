[package]
name = "tacenta-vectors-rust"
version = "0.0.0"
edition = "2024"
description = "Rust conformance runner: loads the shared test vectors and checks tacenta-core against them."
publish = false

[dependencies]
tacenta-core = { path = "../../../tacenta-core" }
tacenta-erasure = { path = "../../../tacenta-core/erasure" }
tacenta-spqr = { path = "../../../tacenta-core/spqr" }
tacenta-braid = { path = "../../../tacenta-core/braid" }
tacenta-triple = { path = "../../../tacenta-core/triple" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
