# Public CI for the open tacenta-core repository.
#
# This runs the steps of `tooling/ci.sh`, split into jobs so a failure names
# its cause. No job holds a secret. Pull requests run every job on
# GitHub-hosted runners. A push to main runs the two Lean jobs, `proofs` and
# `translation`, on a self-hosted runner instead: an organisation runner group
# that GitHub lets only this file, as it is on main, use, running as an
# unprivileged account that holds no keys. A pull request runs its own copy of
# this file, so nothing written here could keep one off that runner; the
# group's restriction does. The `runs-on` expressions below only stop a pull
# request queueing for a runner it cannot have, and
# `tooling/check-workflows.sh` refuses a `runs-on` that names the self-hosted
# runner without the push-to-main condition.
# Five of the script's steps are optional on a developer's machine and
# unconditional here, because this workflow installs what they need: the
# advisory audit, the MSRV check, the 32-bit check, the Linux halves of the
# constant-time disassembly gate (the `rust` job adds the aarch64 target
# beside its x86_64 host), and the committed translation built with its
# T1/T3 proofs and scanned for `sorry` by `tacenta-proofs/scripts/no-sorry.sh`
# (the `translation` job, the heavy one). Two of the script's steps do not
# run here at all: the interoperability harness, which is not in this tree,
# and the fuzz smoke run. What runs outside this repository altogether, and
# why, is stated in the root README under "Building and checking":
# regenerating the translation from the Rust (pinned Charon/Aeneas), the
# coverage-guided fuzzing, and the timing measurements.
#
# Every third-party action is pinned by commit digest, with the tag in a
# trailing comment; `tooling/check-workflows.sh` enforces that, along with the
# `permissions` block, `persist-credentials: false` on every checkout, and the
# rule that nothing is piped from the network into a shell. The Lean toolchain
# is installed from a fixed elan release whose archive digest is checked
# before it runs (`tooling/install-elan.sh`); the pin is the release tag and
# the sha256 together.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here writes to the repository, and a workflow
# that runs on pull requests should not hold a token that could.
permissions:
  contents: read

# One run per ref at a time. A pull request that is pushed to again cancels
# the run for its previous head; a push to main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The elan release the Lean jobs install, and the sha256 of its
  # x86_64-unknown-linux-gnu archive as published at
  # https://github.com/leanprover/elan/releases/tag/v4.2.4. Bumping the
  # release means recomputing the digest; a mismatch fails the job.
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
  # The Rust version `tooling/ci.sh` and the crates' `rust-version` fields
  # name. The `msrv` job checks the workspace still compiles on it.
  MSRV: "1.87"

jobs:
  # The Rust crates on stable: format, lint, tests, with the property-based
  # decoder tests at the case count `tooling/ci.sh` sets.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-core
      - id: rust_fmt
        run: cargo fmt --check
      - id: rust_clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - id: rust_test
        run: cargo test --locked --workspace
        env:
          PROPTEST_CASES: 2048
      # The SPQR follow-up has a semantic allocator-spy regression through the
      # public Session API. Keep it feature-gated so the review instrumentation
      # is never part of the normal library surface, but run it in CI so a
      # skipped feature cannot make the evidence vacuous.
      - id: rust_spqr_erasure
        name: SPQR erasure regression through Session
        run: cargo test --locked --features private-erasure-review --test spqr_erasure_public -- --test-threads=1
      # The two hand-written constant-time functions, read in the release
      # assembly for the runner's own x86_64 and for aarch64: any conditional
      # branch beyond `mac_eq`'s public length compare fails, as does a symbol
      # that was inlined away. `--emit=asm` needs no linker, so the target
      # needs only its `rust-std`. The script is under `tooling/` at the
      # repository root; this job's working directory is `tacenta-core`.
      - id: rust_target
        run: rustup target add aarch64-unknown-linux-gnu
      - id: rust_ct_asm
        name: The constant-time functions compile to straight-line code
        run: bash ../tooling/check-constant-time-asm.sh
      - uses: ./.github/actions/assurance-receipt
        with:
          id: rust
          classification: required
          command: cargo-test-clippy-format-and-constant-time
          required-outcomes: "rust_fmt=${{ steps.rust_fmt.outcome }},rust_clippy=${{ steps.rust_clippy.outcome }},rust_test=${{ steps.rust_test.outcome }},rust_spqr_erasure=${{ steps.rust_spqr_erasure.outcome }},rust_target=${{ steps.rust_target.outcome }},rust_ct_asm=${{ steps.rust_ct_asm.outcome }}"

  # The minimum supported Rust version still compiles the workspace. A check,
  # not a test run: the tests run on stable above, and this exists so a use of
  # a newer standard-library feature is caught before it reaches a consumer
  # holding the version the manifests promise.
  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-core
      - id: msrv_check
        run: cargo check --locked --workspace --all-targets
      - uses: ./.github/actions/assurance-receipt
        with:
          id: msrv
          classification: required
          command: cargo-check-msrv
          required-outcomes: "msrv_check=${{ steps.msrv_check.outcome }}"

  # The decoders cast attacker-controlled lengths to `usize`, which is a
  # different width on a phone; the overflow guards are written for 32 bits
  # and this keeps that target compiling. A compile check, not a run: see the
  # note in `tooling/ci.sh`.
  armv7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: armv7-linux-androideabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-core
      - id: armv7_check
        run: cargo check --locked --workspace --target armv7-linux-androideabi
      - uses: ./.github/actions/assurance-receipt
        with:
          id: armv7
          classification: required
          command: cargo-check-armv7
          required-outcomes: "armv7_check=${{ steps.armv7_check.outcome }}"

  # The Rust conformance runner: the committed vectors under
  # `tacenta-test-vectors/vectors` against tacenta-core. Whether those vectors
  # are current with the model is the `proofs` job's question, below.
  vectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-test-vectors/runners/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-test-vectors/runners/rust
      - id: vectors_fmt
        run: cargo fmt --check
      - id: vectors_clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The differential harness (ADR-0008, practice 9) in
      # `tests/differential.rs` runs generated operation sequences through both
      # sides, so this job needs the model as well as the crates. It drives it
      # through `lake exe difftest`, which `lake build` produces along with the
      # model and the vector generator. `tacenta-model` is a plain Lean package
      # with no Mathlib, so this is about a minute from cold and needs none of
      # the cache machinery the two Lean jobs carry.
      - id: vectors_elan
        name: Install the pinned elan release
        working-directory: .
        run: bash tooling/install-elan.sh
      - name: Build the model, including the differential harness
        id: vectors_model
        working-directory: tacenta-model
        run: lake build
      # `TACENTA_DIFFTEST_REQUIRED` makes a missing model binary fail the
      # harness rather than skip it: a gate that cannot run must not report
      # green. `tooling/ci.sh` sets the same variable.
      - id: vectors_test
        run: cargo test --locked --workspace
        env:
          TACENTA_DIFFTEST_REQUIRED: "1"
      # The independent reader, written from tacenta-spec and the vectors alone
      # (ADR-0006). Standard library only, so it needs no setup step.
      - id: vectors_reader
        run: python3 ../independent/reader/run.py | tail -n 22
        shell: bash
      - id: vectors_skip
        run: python3 ../independent/reader/test_skip_allowlist.py
      - id: vectors_session_reader
        run: cd ../../.. && python3 tacenta-test-vectors/runners/independent/session-operation-reader.py
      - uses: ./.github/actions/assurance-receipt
        with:
          id: vectors
          classification: required
          command: conformance-and-independent-readers
          required-outcomes: "vectors_fmt=${{ steps.vectors_fmt.outcome }},vectors_clippy=${{ steps.vectors_clippy.outcome }},vectors_elan=${{ steps.vectors_elan.outcome }},vectors_model=${{ steps.vectors_model.outcome }},vectors_test=${{ steps.vectors_test.outcome }},vectors_reader=${{ steps.vectors_reader.outcome }},vectors_skip=${{ steps.vectors_skip.outcome }},vectors_session_reader=${{ steps.vectors_session_reader.outcome }}"

  # Known advisories against tacenta-core's dependency graph. Fails on a
  # vulnerability; warnings (unmaintained, yanked) are printed and do not
  # fail, as in `tooling/ci.sh`. `cargo-audit` is built from crates.io with
  # `--locked`, so what runs is the release named here and its own lockfile.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - id: audit_install
        run: cargo install --locked cargo-audit
      - id: audit_run
        run: cargo audit
        working-directory: tacenta-core
      - uses: ./.github/actions/assurance-receipt
        with:
          id: audit
          classification: required
          command: cargo-audit
          required-outcomes: "audit_install=${{ steps.audit_install.outcome }},audit_run=${{ steps.audit_run.outcome }}"

  # The Lean model and the model-layer proofs, and the vectors' currency.
  # `lake build` in tacenta-model compiles the model, the properties, and
  # `genvectors` (all default targets); `verify.sh` builds the proofs and
  # refuses `sorry`; then the vectors are regenerated from the model and must
  # match what is committed. The `sorry` scan over the translation package is
  # `scripts/no-sorry.sh`, which the `translation` job runs (it needs the
  # translation's Mathlib cache first).
  proofs:
    # GitHub-hosted for a pull request, self-hosted for a push to main (see the
    # header).
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "tacenta-core"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: proofs_elan
        name: Install the pinned elan release
        run: bash tooling/install-elan.sh
      # The Lean build outputs, restored on pull requests only. The `translation`
      # job below saves them and says why a restored build is still checked in
      # full. The path list must match that job's exactly: a cache is looked up
      # by its paths as well as its key.
      - name: Restore the Lean build outputs (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tacenta-model/.lake/build
            tacenta-proofs/.lake/build
            tacenta-proofs/translation/.lake/build
            tacenta-proofs/translation/.lake/packages/aeneas/backends/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-
      - id: proofs_model
        name: The model builds, including the vector generator
        run: (cd tacenta-model && lake build)
      - id: proofs_verify
        name: The proofs build and use no sorry
        run: bash tacenta-proofs/scripts/verify.sh
      - id: proofs_vectors
        name: The committed vectors are current with the model
        run: |
          bash tacenta-test-vectors/regenerate-vectors.sh
          vector_status="$(git status --porcelain --untracked-files=all -- tacenta-test-vectors/vectors)"
          if [ -n "$vector_status" ]; then
            printf '%s\n' "$vector_status" >&2
            exit 1
          fi
      - uses: ./.github/actions/assurance-receipt
        with:
          id: proofs
          classification: required
          command: model-proofs-and-vector-currency
          required-outcomes: "proofs_elan=${{ steps.proofs_elan.outcome }},proofs_model=${{ steps.proofs_model.outcome }},proofs_verify=${{ steps.proofs_verify.outcome }},proofs_vectors=${{ steps.proofs_vectors.outcome }}"

  # The committed Rust-to-Lean translation and the T1/T3 proofs over it, plus
  # the model and model-layer proofs, all built and scanned for incomplete
  # declarations by `tacenta-proofs/scripts/no-sorry.sh` (which also asserts
  # every translation module was elaborated and that no axiom, `partial def`,
  # `unsafe`, `implemented_by` or `extern` entered hand-written Lean). This is
  # the heavy build: Aeneas's Lean library brings Mathlib, fetched prebuilt
  # from Mathlib's cache. It runs here so a public reader has the
  # translation's theorems checked in public rather than on the private
  # workflow's word. What this does NOT do is regenerate the translation from
  # the Rust: that needs the pinned Charon and Aeneas binaries and runs
  # outside this repository; `tacenta-proofs/CLAIMS.md` states the release
  # and its digest.
  translation:
    # GitHub-hosted for a pull request, self-hosted for a push to main (see the
    # header).
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "tacenta-core"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: translation_elan
        name: Install the pinned elan release
        run: bash tooling/install-elan.sh
      # Mathlib's own compressed build files, which `lake exe cache get`
      # otherwise downloads from Mathlib's cache server on every run. Keyed on
      # the translation's manifest, so a Mathlib bump downloads afresh. The
      # files are the ones `cache get` would fetch; it still unpacks them. The
      # directory is named explicitly with `MATHLIB_CACHE_DIR`, which Mathlib's
      # cache reads before `XDG_CACHE_HOME` and `~/.cache`, so the path cached
      # is the path used. Keep it inside the workspace: the previous home-cache
      # archive was produced with parent-relative entries and could not be
      # unpacked on a hosted runner. The versioned key also avoids reusing it.
      - name: Restore Mathlib's downloaded cache files
        id: mathlib-files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/tacenta-mathlib
          key: mathlib-files-v2-${{ runner.os }}-${{ hashFiles('tacenta-proofs/translation/lake-manifest.json') }}
          lookup-only: ${{ runner.environment == 'self-hosted' }}
      # The checkout has just deleted `.lake`. A hosted runner clones the Lake
      # dependencies in the next step, quickly; the self-hosted machine clones
      # them from local mirrors instead, at the revisions the manifest pins.
      - id: translation_seed
        name: Clone the Lake dependencies from local mirrors (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: bash tooling/seed-lake-packages.sh tacenta-proofs/translation
      - id: translation_fetch
        name: Fetch the Mathlib cache
        working-directory: tacenta-proofs/translation
        shell: bash
        run: |
          export MATHLIB_CACHE_DIR="$GITHUB_WORKSPACE/.cache/tacenta-mathlib"
          lake exe cache get
      - name: Save Mathlib's downloaded cache files (pushes to main only)
        if: github.event_name == 'push' && steps.mathlib-files.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/tacenta-mathlib
          key: mathlib-files-v2-${{ runner.os }}-${{ hashFiles('tacenta-proofs/translation/lake-manifest.json') }}
      # The Lean build outputs of this tree's three packages and of the Aeneas
      # library, which Mathlib's cache does not carry. Without them every run
      # rebuilds all of it, which is most of this job's time.
      #
      # Only a push to main saves this cache, only when its build succeeded,
      # and a push to main never restores it: what is cached is always the cold
      # build of a main commit. A pull request restores the newest one with the
      # same toolchain and dependency pins. Lake compares each module's inputs
      # by hash, so a module whose sources or imports changed is rebuilt and
      # re-elaborated. A module whose inputs hash the same is not: its tactics,
      # `#guard_msgs` pins, `example`s and axiom audit do not run again on the
      # pull request, and what the `sorry` scan and the axiom comparison read
      # for it are the messages main's cold build logged, which Lake replays.
      # The kernel replay in `no-sorry.sh` still re-checks every declaration of
      # every module under `Translation/`, `Proofs/`, `Model/` and `Properties/`
      # from its olean. A pull request's run can save caches only into its own
      # merge ref, which main's runs never read. The cache is restored after
      # the Mathlib fetch because the Aeneas path sits inside a package that
      # step clones.
      - name: Restore the Lean build outputs (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tacenta-model/.lake/build
            tacenta-proofs/.lake/build
            tacenta-proofs/translation/.lake/build
            tacenta-proofs/translation/.lake/packages/aeneas/backends/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-
      - id: translation_no_sorry
        name: The translation, proofs and model build with no incomplete declaration
        shell: bash
        run: bash tacenta-proofs/scripts/no-sorry.sh
      - name: Save the Lean build outputs (pushes to main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tacenta-model/.lake/build
            tacenta-proofs/.lake/build
            tacenta-proofs/translation/.lake/build
            tacenta-proofs/translation/.lake/packages/aeneas/backends/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-${{ github.sha }}
      # The local-mirror seed is a required command only on the self-hosted
      # push runner. A hosted pull request must omit that inapplicable step
      # from its receipt rather than recording `skipped` as a pass.
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/assurance-receipt
        with:
          id: translation
          classification: required
          command: translation-proofs-and-no-sorry
          required-outcomes: "translation_elan=${{ steps.translation_elan.outcome }},translation_fetch=${{ steps.translation_fetch.outcome }},translation_no_sorry=${{ steps.translation_no_sorry.outcome }}"
      - if: github.event_name == 'push'
        uses: ./.github/actions/assurance-receipt
        with:
          id: translation
          classification: required
          command: translation-proofs-and-no-sorry
          required-outcomes: "translation_elan=${{ steps.translation_elan.outcome }},translation_seed=${{ steps.translation_seed.outcome }},translation_fetch=${{ steps.translation_fetch.outcome }},translation_no_sorry=${{ steps.translation_no_sorry.outcome }}"

  # The repository's own consistency checks: the ones `tooling/ci.sh` runs
  # before building anything, plus the attestation gate.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # `check-workflows.sh` parses the workflow files with PyYAML. The runner
      # image happens to carry it today; installing it names the dependency
      # rather than relying on that, and the script fails on the runner
      # (rather than skipping) if the import still does not resolve.
      - name: PyYAML for the workflow check
        id: checks_01
        run: python3 -m pip install --user pyyaml
      - id: checks_02
        run: bash tooling/check-workflows.sh
      - id: checks_03
        run: bash tooling/tests/run-check-workflows-cases.sh
      - name: Install pinned actionlint
        id: checks_04
        run: bash tooling/install-actionlint.sh "$RUNNER_TEMP/actionlint"
      - id: checks_05
        run: ACTIONLINT_BIN="$RUNNER_TEMP/actionlint/actionlint" bash tooling/check-actionlint.sh
      - id: checks_06
        run: ACTIONLINT_BIN="$RUNNER_TEMP/actionlint/actionlint" bash tooling/tests/run-check-actionlint-cases.sh
      - id: checks_07
        run: bash tooling/tests/run-check-constant-time-asm-cases.sh
      - id: checks_08
        run: bash tooling/check-proof-hygiene.sh
      - id: checks_09
        run: bash tooling/check-conflict-markers.sh
      - id: checks_10
        run: python3 tooling/check-lifecycle-boundary-surface.py
      - id: checks_11
        run: bash tooling/tests/run-check-lifecycle-boundary-surface-cases.sh
      - id: checks_12
        run: python3 tooling/check-precondition-shapes.py
      - id: checks_13
        run: bash tooling/tests/run-check-precondition-shapes-cases.sh
      # The three-leaf translation unit, `tacenta-core/triple-unit`, is
      # generated from the three leaf crates. This re-assembles it into a
      # temporary directory and diffs, so a hand-edited unit crate or one left
      # behind by a leaf edit fails here. It needs no Charon, Aeneas or Lean,
      # so it belongs in this job beside the other source-level checks.
      - id: checks_14
        run: sh tacenta-proofs/scripts/assemble-triple-unit.sh --check
      # The Braid-and-erasure unit, `tacenta-core/braid-unit`, likewise.
      - id: checks_15
        run: sh tacenta-proofs/scripts/assemble-braid-unit.sh --check
      - id: checks_16
        run: bash tacenta-proofs/scripts/port-unit-proofs.sh --check
      # The eight-leaf Session unit and its seven ported proof modules are
      # deterministic copies; a stale copy is refused here, as tooling/ci.sh does.
      - id: checks_17
        run: sh tacenta-proofs/scripts/assemble-session-unit.sh --check
      - id: checks_18
        run: bash tacenta-proofs/scripts/port-session-unit-proofs.sh --check
      - id: checks_19
        run: bash tacenta-proofs/scripts/port-session-pqxdh-proof.sh --check
      - id: checks_20
        run: bash tacenta-proofs/scripts/port-session-erasure-proof.sh --check
      - id: checks_21
        run: bash tacenta-proofs/scripts/port-session-braid-proof.sh --check
      - id: checks_22
        run: bash tacenta-proofs/scripts/port-session-braid-refinement.sh --check
      - id: checks_23
        run: bash tacenta-proofs/scripts/port-session-ratchet-import-proof.sh --check
      - id: checks_24
        run: bash tacenta-proofs/scripts/port-session-braid-import-proof.sh --check
      - id: checks_25
        run: bash tooling/check-labels.sh
      - id: checks_26
        run: bash tooling/tests/run-check-labels-cases.sh
      - id: checks_27
        run: python3 tooling/check-traceability.py
      - id: checks_28
        run: bash tooling/tests/run-check-traceability-cases.sh
      - id: checks_29
        run: python3 tooling/check_authentication_boundary.py
      - id: checks_30
        run: python3 tooling/check-vectors.py
      - id: checks_31
        run: bash tooling/tests/run-check-vectors-cases.sh
      - id: checks_32
        run: python3 tooling/check-session-operation-traces.py
      - id: checks_33
        run: bash tooling/tests/run-check-session-operation-traces-cases.sh
      - id: checks_34
        run: bash tooling/tests/run-build-assurance-manifest-cases.sh
      - id: checks_35
        run: bash tooling/tests/run-collect-assurance-receipts-cases.sh
      - id: checks_36
        run: bash tooling/tests/run-check-signoff-cases.sh
      - id: checks_37
        run: bash tooling/tests/run-build-evidence-pack-cases.sh
      - id: checks_38
        run: bash tooling/tests/run-check-ledger-review-receipt-cases.sh
      # Pull requests check every added commit in the conditional sign-off job.
      # A push to main must also check the commits introduced by that push:
      # otherwise a squash or merge commit can bypass the only DCO gate after
      # the pull request has been merged. `checks` has the full history, and
      # github.event.before is the exact parent boundary for this push.
      - name: Commits introduced by a main push are signed off
        id: checks_39
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash tooling/check-signoff.sh "$BASE_SHA"
      # Note the assurance boundary: this checks the attestation manifest
      # against the source hashes. It does NOT re-derive the Rust->Lean
      # (Charon/Aeneas) translation, which runs on dedicated runners;
      # the `translation` job above checks the *committed* translation's
      # proofs. A green attest check confirms the manifest matches the tree,
      # not that the translation was regenerated on this run.
      - name: Claims and attestations cover what ships
        id: checks_40
        run: |
          python3 tacenta-proofs/scripts/attest.py --check
          bash tacenta-proofs/scripts/check-attest-negatives.sh
      # The push-only DCO step is intentionally absent on pull requests.  Do
      # not encode its expected `skipped` outcome as required: a required
      # receipt must list only commands applicable to this event.
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/assurance-receipt
        with:
          id: checks
          classification: required
          command: source-and-assurance-checks
          required-outcomes: "checks_01=${{ steps.checks_01.outcome }},checks_02=${{ steps.checks_02.outcome }},checks_03=${{ steps.checks_03.outcome }},checks_04=${{ steps.checks_04.outcome }},checks_05=${{ steps.checks_05.outcome }},checks_06=${{ steps.checks_06.outcome }},checks_07=${{ steps.checks_07.outcome }},checks_08=${{ steps.checks_08.outcome }},checks_09=${{ steps.checks_09.outcome }},checks_10=${{ steps.checks_10.outcome }},checks_11=${{ steps.checks_11.outcome }},checks_12=${{ steps.checks_12.outcome }},checks_13=${{ steps.checks_13.outcome }},checks_14=${{ steps.checks_14.outcome }},checks_15=${{ steps.checks_15.outcome }},checks_16=${{ steps.checks_16.outcome }},checks_17=${{ steps.checks_17.outcome }},checks_18=${{ steps.checks_18.outcome }},checks_19=${{ steps.checks_19.outcome }},checks_20=${{ steps.checks_20.outcome }},checks_21=${{ steps.checks_21.outcome }},checks_22=${{ steps.checks_22.outcome }},checks_23=${{ steps.checks_23.outcome }},checks_24=${{ steps.checks_24.outcome }},checks_25=${{ steps.checks_25.outcome }},checks_26=${{ steps.checks_26.outcome }},checks_27=${{ steps.checks_27.outcome }},checks_28=${{ steps.checks_28.outcome }},checks_29=${{ steps.checks_29.outcome }},checks_30=${{ steps.checks_30.outcome }},checks_31=${{ steps.checks_31.outcome }},checks_32=${{ steps.checks_32.outcome }},checks_33=${{ steps.checks_33.outcome }},checks_34=${{ steps.checks_34.outcome }},checks_35=${{ steps.checks_35.outcome }},checks_36=${{ steps.checks_36.outcome }},checks_37=${{ steps.checks_37.outcome }},checks_38=${{ steps.checks_38.outcome }},checks_40=${{ steps.checks_40.outcome }}"
      - if: github.event_name == 'push'
        uses: ./.github/actions/assurance-receipt
        with:
          id: checks
          classification: required
          command: source-and-assurance-checks
          required-outcomes: "checks_01=${{ steps.checks_01.outcome }},checks_02=${{ steps.checks_02.outcome }},checks_03=${{ steps.checks_03.outcome }},checks_04=${{ steps.checks_04.outcome }},checks_05=${{ steps.checks_05.outcome }},checks_06=${{ steps.checks_06.outcome }},checks_07=${{ steps.checks_07.outcome }},checks_08=${{ steps.checks_08.outcome }},checks_09=${{ steps.checks_09.outcome }},checks_10=${{ steps.checks_10.outcome }},checks_11=${{ steps.checks_11.outcome }},checks_12=${{ steps.checks_12.outcome }},checks_13=${{ steps.checks_13.outcome }},checks_14=${{ steps.checks_14.outcome }},checks_15=${{ steps.checks_15.outcome }},checks_16=${{ steps.checks_16.outcome }},checks_17=${{ steps.checks_17.outcome }},checks_18=${{ steps.checks_18.outcome }},checks_19=${{ steps.checks_19.outcome }},checks_20=${{ steps.checks_20.outcome }},checks_21=${{ steps.checks_21.outcome }},checks_22=${{ steps.checks_22.outcome }},checks_23=${{ steps.checks_23.outcome }},checks_24=${{ steps.checks_24.outcome }},checks_25=${{ steps.checks_25.outcome }},checks_26=${{ steps.checks_26.outcome }},checks_27=${{ steps.checks_27.outcome }},checks_28=${{ steps.checks_28.outcome }},checks_29=${{ steps.checks_29.outcome }},checks_30=${{ steps.checks_30.outcome }},checks_31=${{ steps.checks_31.outcome }},checks_32=${{ steps.checks_32.outcome }},checks_33=${{ steps.checks_33.outcome }},checks_34=${{ steps.checks_34.outcome }},checks_35=${{ steps.checks_35.outcome }},checks_36=${{ steps.checks_36.outcome }},checks_37=${{ steps.checks_37.outcome }},checks_38=${{ steps.checks_38.outcome }},checks_39=${{ steps.checks_39.outcome }},checks_40=${{ steps.checks_40.outcome }}"

  # Every commit a pull request adds is signed off by its author under the
  # Developer Certificate of Origin (CONTRIBUTING.md). Only pull requests: a
  # push to main carries commits that were checked as a pull request, and the
  # history from before this check has no sign-off. The full history is fetched
  # so the base branch is there to compare against. The base branch name is
  # passed through the environment, not interpolated into the script.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Every added commit is signed off by its author
        id: signoff_check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tooling/check-signoff.sh "origin/${BASE_REF}"
      - uses: ./.github/actions/assurance-receipt
        with:
          id: sign-off
          classification: conditional
          command: tooling-check-signoff
          required-outcomes: "signoff_check=${{ steps.signoff_check.outcome }}"

  assurance-receipts:
    needs: [rust, msrv, armv7, vectors, audit, proofs, translation, checks, sign-off]
    # The collector must run even when a dependency failed or the conditional
    # sign-off job was skipped on a push. Its receipt validator then fails
    # closed on missing, failed or cross-candidate records. The workflow gate
    # allows this exact unconditional exception and rejects other job-level
    # conditions.
    if: always()
    runs-on: ubuntu-latest
    env:
      # The collector validates a clean checkout after importing the shared
      # Python validator. Do not leave interpreter bytecode outside the
      # CI-created .assurance workspace for that check to mistake as a source
      # mutation.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: assurance-receipt-*
          path: .assurance/receipts
          merge-multiple: true
      - run: python3 tooling/collect-assurance-receipts.py --event '${{ github.event_name }}' --input-dir .assurance/receipts --output .assurance/assurance-receipts.json
      - run: python3 tooling/build-assurance-manifest.py --receipts .assurance/assurance-receipts.json --output .assurance/assurance-manifest.json
      - run: python3 tooling/build-assurance-manifest.py --validate .assurance/assurance-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assurance-receipts
          path: |
            .assurance/assurance-receipts.json
            .assurance/assurance-manifest.json
          if-no-files-found: error
          retention-days: 7
