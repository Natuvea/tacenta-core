# Public CI for the open tacenta-core repository.
#
# This runs the steps of `tooling/ci.sh`, split into jobs so a failure names
# its cause. Everything here runs on a GitHub-hosted runner without secrets.
# Five of the script's steps are optional on a developer's machine and
# unconditional here, because this workflow installs what they need: the
# advisory audit, the MSRV check, the 32-bit check, the Linux halves of the
# constant-time disassembly gate (the `rust` job adds the aarch64 target
# beside its x86_64 host), and the committed translation built with its
# T1/T3 proofs and scanned for `sorry` by `tacenta-proofs/scripts/no-sorry.sh`
# (the `translation` job, the heavy one). Two of the script's steps do not
# run here at all: the interoperability harness, which is not in this tree,
# and the fuzz smoke run. What runs outside this repository altogether, and
# why, is stated in the root README under "Building and checking":
# regenerating the translation from the Rust (pinned Charon/Aeneas), the
# coverage-guided fuzzing, and the timing measurements.
#
# Every third-party action is pinned by commit digest, with the tag in a
# trailing comment; `tooling/check-workflows.sh` enforces that, along with the
# `permissions` block, `persist-credentials: false` on every checkout, and the
# rule that nothing is piped from the network into a shell. The Lean toolchain
# is installed from a fixed elan release whose archive digest is checked
# before it runs (`tooling/install-elan.sh`); the pin is the release tag and
# the sha256 together.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here writes to the repository, and a workflow
# that runs on pull requests should not hold a token that could.
permissions:
  contents: read

# One run per ref at a time. A pull request that is pushed to again cancels
# the run for its previous head; a push to main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The elan release the Lean jobs install, and the sha256 of its
  # x86_64-unknown-linux-gnu archive as published at
  # https://github.com/leanprover/elan/releases/tag/v4.2.4. Bumping the
  # release means recomputing the digest; a mismatch fails the job.
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
  # The Rust version `tooling/ci.sh` and the crates' `rust-version` fields
  # name. The `msrv` job checks the workspace still compiles on it.
  MSRV: "1.87"

jobs:
  # The Rust crates on stable: format, lint, tests, with the property-based
  # decoder tests at the case count `tooling/ci.sh` sets.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-core
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          PROPTEST_CASES: 2048
      # The two hand-written constant-time functions, read in the release
      # assembly for the runner's own x86_64 and for aarch64: any conditional
      # branch beyond `mac_eq`'s public length compare fails, as does a symbol
      # that was inlined away. `--emit=asm` needs no linker, so the target
      # needs only its `rust-std`. The script is under `tooling/` at the
      # repository root; this job's working directory is `tacenta-core`.
      - run: rustup target add aarch64-unknown-linux-gnu
      - name: The constant-time functions compile to straight-line code
        run: bash ../tooling/check-constant-time-asm.sh

  # The minimum supported Rust version still compiles the workspace. A check,
  # not a test run: the tests run on stable above, and this exists so a use of
  # a newer standard-library feature is caught before it reaches a consumer
  # holding the version the manifests promise.
  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-core
      - run: cargo check --locked --workspace --all-targets

  # The decoders cast attacker-controlled lengths to `usize`, which is a
  # different width on a phone; the overflow guards are written for 32 bits
  # and this keeps that target compiling. A compile check, not a run: see the
  # note in `tooling/ci.sh`.
  armv7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: armv7-linux-androideabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-core
      - run: cargo check --locked --workspace --target armv7-linux-androideabi

  # The Rust conformance runner: the committed vectors under
  # `tacenta-test-vectors/vectors` against tacenta-core. Whether those vectors
  # are current with the model is the `proofs` job's question, below.
  vectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tacenta-test-vectors/runners/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tacenta-test-vectors/runners/rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  # Known advisories against tacenta-core's dependency graph. Fails on a
  # vulnerability; warnings (unmaintained, yanked) are printed and do not
  # fail, as in `tooling/ci.sh`. `cargo-audit` is built from crates.io with
  # `--locked`, so what runs is the release named here and its own lockfile.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit
        working-directory: tacenta-core

  # The Lean model and the model-layer proofs, and the vectors' currency.
  # `lake build` in tacenta-model compiles the model, the properties, and
  # `genvectors` (all default targets); `verify.sh` builds the proofs and
  # refuses `sorry`; then the vectors are regenerated from the model and must
  # match what is committed. The `sorry` scan over the translation package is
  # `scripts/no-sorry.sh`, which the `translation` job runs (it needs the
  # translation's Mathlib cache first).
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned elan release
        run: bash tooling/install-elan.sh
      # The Lean build outputs, restored on pull requests only. The `translation`
      # job below saves them and says why a restored build is still checked in
      # full. The path list must match that job's exactly: a cache is looked up
      # by its paths as well as its key.
      - name: Restore the Lean build outputs (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tacenta-model/.lake/build
            tacenta-proofs/.lake/build
            tacenta-proofs/translation/.lake/build
            tacenta-proofs/translation/.lake/packages/aeneas/backends/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-
      - name: The model builds, including the vector generator
        run: (cd tacenta-model && lake build)
      - name: The proofs build and use no sorry
        run: bash tacenta-proofs/scripts/verify.sh
      - name: The committed vectors are current with the model
        run: |
          bash tacenta-test-vectors/regenerate-vectors.sh
          git diff --exit-code -- tacenta-test-vectors/vectors

  # The committed Rust-to-Lean translation and the T1/T3 proofs over it, plus
  # the model and model-layer proofs, all built and scanned for incomplete
  # declarations by `tacenta-proofs/scripts/no-sorry.sh` (which also asserts
  # every translation module was elaborated and that no axiom, `partial def`,
  # `unsafe`, `implemented_by` or `extern` entered hand-written Lean). This is
  # the heavy build: Aeneas's Lean library brings Mathlib, fetched prebuilt
  # from Mathlib's cache. It runs here so a public reader has the
  # translation's theorems checked in public rather than on the private
  # workflow's word. What this does NOT do is regenerate the translation from
  # the Rust: that needs the pinned Charon and Aeneas binaries and runs
  # outside this repository; `tacenta-proofs/CLAIMS.md` states the release
  # and its digest.
  translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned elan release
        run: bash tooling/install-elan.sh
      # Mathlib's own compressed build files, which `lake exe cache get`
      # otherwise downloads from Mathlib's cache server on every run. Keyed on
      # the translation's manifest, so a Mathlib bump downloads afresh. The
      # files are the ones `cache get` would fetch; it still unpacks them. The
      # directory is named explicitly with `MATHLIB_CACHE_DIR`, which Mathlib's
      # cache reads before `XDG_CACHE_HOME` and `~/.cache`, so the path cached
      # is the path used.
      - name: Restore Mathlib's downloaded cache files
        id: mathlib-files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mathlib-cache
          key: mathlib-files-${{ runner.os }}-${{ hashFiles('tacenta-proofs/translation/lake-manifest.json') }}
      - name: Fetch the Mathlib cache
        working-directory: tacenta-proofs/translation
        env:
          MATHLIB_CACHE_DIR: ${{ runner.temp }}/mathlib-cache
        run: lake exe cache get
      - name: Save Mathlib's downloaded cache files (pushes to main only)
        if: github.event_name == 'push' && steps.mathlib-files.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mathlib-cache
          key: mathlib-files-${{ runner.os }}-${{ hashFiles('tacenta-proofs/translation/lake-manifest.json') }}
      # The Lean build outputs of this tree's three packages and of the Aeneas
      # library, which Mathlib's cache does not carry. Without them every run
      # rebuilds all of it, which is most of this job's time.
      #
      # Only a push to main saves this cache, only when its build succeeded,
      # and a push to main never restores it: what is cached is always the cold
      # build of a main commit. A pull request restores the newest one with the
      # same toolchain and dependency pins. Lake compares each module's inputs
      # by hash, so a module whose sources or imports changed is rebuilt and
      # re-elaborated. A module whose inputs hash the same is not: its tactics,
      # `#guard_msgs` pins, `example`s and axiom audit do not run again on the
      # pull request, and what the `sorry` scan and the axiom comparison read
      # for it are the messages main's cold build logged, which Lake replays.
      # The kernel replay in `no-sorry.sh` still re-checks every declaration of
      # every module under `Translation/`, `Proofs/`, `Model/` and `Properties/`
      # from its olean. A pull request's run can save caches only into its own
      # merge ref, which main's runs never read. The cache is restored after
      # the Mathlib fetch because that step clones the Aeneas package, and
      # would discard build outputs restored inside it beforehand.
      - name: Restore the Lean build outputs (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tacenta-model/.lake/build
            tacenta-proofs/.lake/build
            tacenta-proofs/translation/.lake/build
            tacenta-proofs/translation/.lake/packages/aeneas/backends/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-
      - name: The translation, proofs and model build with no incomplete declaration
        shell: bash
        run: bash tacenta-proofs/scripts/no-sorry.sh
      - name: Save the Lean build outputs (pushes to main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tacenta-model/.lake/build
            tacenta-proofs/.lake/build
            tacenta-proofs/translation/.lake/build
            tacenta-proofs/translation/.lake/packages/aeneas/backends/lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('tacenta-model/lean-toolchain', 'tacenta-model/lake-manifest.json', 'tacenta-proofs/lean-toolchain', 'tacenta-proofs/lake-manifest.json', 'tacenta-proofs/translation/lean-toolchain', 'tacenta-proofs/translation/lake-manifest.json') }}-${{ github.sha }}

  # The repository's own consistency checks: the ones `tooling/ci.sh` runs
  # before building anything, plus the attestation gate.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # `check-workflows.sh` parses the workflow files with PyYAML. The runner
      # image happens to carry it today; installing it names the dependency
      # rather than relying on that, and the script fails on the runner
      # (rather than skipping) if the import still does not resolve.
      - name: PyYAML for the workflow check
        run: python3 -m pip install --user pyyaml
      - run: bash tooling/check-workflows.sh
      - run: bash tooling/tests/run-check-workflows-cases.sh
      - run: bash tooling/check-proof-hygiene.sh
      - run: python3 tooling/check-precondition-shapes.py
      - run: bash tooling/tests/run-check-precondition-shapes-cases.sh
      # The three-leaf translation unit, `tacenta-core/triple-unit`, is
      # generated from the three leaf crates. This re-assembles it into a
      # temporary directory and diffs, so a hand-edited unit crate or one left
      # behind by a leaf edit fails here. It needs no Charon, Aeneas or Lean,
      # so it belongs in this job beside the other source-level checks.
      - run: sh tacenta-proofs/scripts/assemble-triple-unit.sh --check
      - run: bash tacenta-proofs/scripts/port-unit-proofs.sh --check
      - run: bash tooling/check-labels.sh
      - run: python3 tooling/check_authentication_boundary.py
      - run: python3 tooling/check-vectors.py
      # Note the assurance boundary: this checks the attestation manifest
      # against the source hashes. It does NOT re-derive the Rust->Lean
      # (Charon/Aeneas) translation, which runs on dedicated runners;
      # the `translation` job above checks the *committed* translation's
      # proofs. A green attest check confirms the manifest matches the tree,
      # not that the translation was regenerated on this run.
      - name: Claims and attestations cover what ships
        run: python3 tacenta-proofs/scripts/attest.py --check
