# expect: must have exactly one step that runs
name: t
on: push
permissions:
  contents: read
jobs:
  assurance-receipts:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: download_pack_1
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evidence-pack
          path: .assurance/evidence-pack-downloaded
      - id: download_pack_wait_2
        if: steps.download_pack_1.outcome == 'failure'
        run: rm -rf .assurance/evidence-pack-downloaded && sleep 20
      - id: download_pack_2
        if: steps.download_pack_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evidence-pack
          path: .assurance/evidence-pack-downloaded
      - id: download_pack_wait_3
        if: steps.download_pack_1.outcome == 'failure' && steps.download_pack_2.outcome == 'failure'
        run: rm -rf .assurance/evidence-pack-downloaded && sleep 60
      - id: download_pack_3
        if: steps.download_pack_1.outcome == 'failure' && steps.download_pack_2.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evidence-pack
          path: .assurance/evidence-pack-downloaded
      - run: python3 tooling/build-evidence-pack.py --verify .assurance/evidence-pack-downloaded --candidate-repo . || true
