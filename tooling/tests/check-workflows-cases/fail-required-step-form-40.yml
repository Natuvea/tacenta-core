# expect: has required command step 'translation_seed' with an unapproved step-level `if`
name: t
on: push
permissions:
  contents: read
jobs:
  other-job:
    runs-on: ubuntu-latest
    steps:
      - id: translation_seed
        if: runner.environment == 'self-hosted'
        run: bash tooling/seed-lake-packages.sh tacenta-proofs/translation
      - uses: ./.github/actions/assurance-receipt
        with:
          id: translation
          classification: required
          command: c
          required-outcomes: "translation_seed=${{ steps.translation_seed.outcome }}"
