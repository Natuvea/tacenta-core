name: conditional-required-step
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - id: checks_elan
        run: bash install-elan.sh
      - id: checks_39
        name: Commits introduced by a main push are signed off
        if: github.event_name == 'push'
        run: bash tooling/check-signoff.sh "$BASE_SHA"
      - id: checks_build
        run: lake build
      - id: checks_proof
        run: bash no-sorry.sh
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/assurance-receipt
        with:
          id: checks
          classification: required
          command: checks
          required-outcomes: "checks_elan=${{ steps.checks_elan.outcome }},checks_build=${{ steps.checks_build.outcome }},checks_proof=${{ steps.checks_proof.outcome }}"
      - if: github.event_name == 'push'
        uses: ./.github/actions/assurance-receipt
        with:
          id: checks
          classification: required
          command: checks
          required-outcomes: "checks_elan=${{ steps.checks_elan.outcome }},checks_39=${{ steps.checks_39.outcome }},checks_build=${{ steps.checks_build.outcome }},checks_proof=${{ steps.checks_proof.outcome }}"
