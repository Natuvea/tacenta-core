# expect: required receipt omits command step 'j_second'
name: t
on: push
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: j_run
        run: make test
      - id: j_second
        run: make lint
      - uses: ./.github/actions/assurance-receipt
        with:
          id: j
          classification: required
          command: c
          required-outcomes: "j_run=${{ steps.j_run.outcome }}"
