# expect: emits a required receipt without required command outcomes
name: t
on: push
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - id: j_run
        run: make test
      - uses: ./.github/actions/assurance-receipt
        with:
          id: j
          classification: required
          command: c
          required-outcomes: "  "
