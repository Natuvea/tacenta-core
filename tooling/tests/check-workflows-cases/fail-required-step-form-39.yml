# expect: has required command step 'checks_39' with an unapproved step-level `if`
name: t
on: push
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - id: checks_39
        if: runner.environment == 'self-hosted'
        run: bash tooling/check-signoff.sh "$BASE_SHA"
      - uses: ./.github/actions/assurance-receipt
        with:
          id: checks
          classification: required
          command: c
          required-outcomes: "checks_39=${{ steps.checks_39.outcome }}"
