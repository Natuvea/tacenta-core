# expect: differs from tooling/required-steps.json in 4 more place(s)
# manifest: mini-ci.json
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  V0: "0"
  V1: "1"
  V2: "2"
  V3: "3"
  V4: "4"
  V5: "5"
  V6: "6"
  V7: "7"
  V8: "8"
  V9: "9"
  V10: "10"
  V11: "11"
  V12: "12"
  V13: "13"
  V14: "14"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: build_fmt
        name: Format
        run: make fmt
      - id: build_test
        run: make test
        env:
          CASES: 2048
      - uses: ./.github/actions/assurance-receipt
        with:
          id: build
          classification: required
          command: fmt-and-test
          required-outcomes: "build_fmt=${{ steps.build_fmt.outcome }},build_test=${{ steps.build_test.outcome }}"
