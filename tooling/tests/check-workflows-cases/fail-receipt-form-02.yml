# expect: required receipt omits command step 'checks_39'
name: t
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - id: checks_39
        if: github.event_name == 'push'
        run: bash tooling/check-signoff.sh "$BASE_SHA"
      - id: checks_run
        run: make test
      - if: github.event_name == 'push'
        uses: ./.github/actions/assurance-receipt
        with:
          id: checks
          classification: required
          command: c
          required-outcomes: "checks_run=${{ steps.checks_run.outcome }}"
