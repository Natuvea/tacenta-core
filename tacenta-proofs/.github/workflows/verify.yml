# Reproducible verification CI for tacenta-proofs *as its own repository*.
#
# GitHub ignores a nested `.github/` directory, so this does nothing while the
# component lives inside tacenta-core; the root `ci` workflow is the live
# gate, and its `proofs` job runs the same `verify.sh` this does. It becomes
# live the day tacenta-proofs is lifted into its own repository, which is why
# it is kept correct rather than left as a scaffold: every action here is
# pinned by digest, as the root workflows are, the Lean toolchain is installed
# from a fixed elan release whose archive digest is checked before it runs,
# and `tooling/check-workflows.sh` scans nested workflow directories too.
#
# Only the light gate (model and model-layer proofs) can run on a GitHub-hosted
# runner; the translation needs the pinned Aeneas release, which is
# linux-x86_64 and runs on a dedicated runner. When this repository is split out, port the
# heavy gate from that workflow deliberately rather than by copying.
name: verify
on:
  push:
permissions:
  contents: read
env:
  # The same elan pin the root workflow carries, repeated here because this
  # file has to stand alone once the component is lifted. See the root
  # `tooling/install-elan.sh` for why the digest is checked.
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned elan release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path \
            --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: ./scripts/verify.sh
