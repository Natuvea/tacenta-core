[package]
name = "tacenta-lifecycle"
license = "Apache-2.0"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
tacenta-boundary = { path = "../boundary" }
tacenta-ratchet = { path = "../ratchet" }
tacenta-session = { path = "../session" }
tacenta-kdf = { path = "../kdf" }
tacenta-wire = { path = "../wire" }
tacenta-erasure = { path = "../erasure" }
tacenta-braid = { path = "../braid" }
tacenta-spqr = { path = "../spqr" }
tacenta-triple = { path = "../triple" }
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
