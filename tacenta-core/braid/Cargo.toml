[package]
name = "tacenta-braid"
license = "Apache-2.0"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
description = "The ML-KEM Braid state machine: a sparse continuous key agreement over an unreliable channel."
publish = false

# Every dependency is a leaf: the codec is ours and has none of its own, and the
# two cryptographic ones are trusted boundaries in their own crates precisely so
# a translation of this state machine sees opaque declarations rather than their
# internals. See kdf/Cargo.toml for the history behind that arrangement.
[dependencies]
tacenta-erasure = { path = "../erasure" }
tacenta-kdf = { path = "../kdf" }
tacenta-kem = { path = "../kem" }
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.6"

[dev-dependencies]
rand = "0.8"

[features]
# `Auth::from_root` and `Auth::keys` plant and read the authenticator's root
# and MAC keys. The conformance runner needs them to check the model's
# vectors; nothing shipping does, so they are compiled only for this crate's
# tests and for a consumer that asks (CR-22).
conformance = []
